<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure e Figcaption</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            text-align: center;
        }
 
        figure {
            display: inline-block;
            margin: 20px;
        }
 
        img {
            max-width: 100%;
            height: auto;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
 
        figcaption {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>
 
    <h1>Exemplo de Figure e Figcaption</h1>
 
    <figure>
        <img src="paisagem.jpg"
             alt="Montanhas ao pôr do sol com um lago ao fundo"
             width="600">
        <figcaption>
            Paisagem de montanhas ao pôr do sol refletidas em um lago.
        </figcaption>
    </figure>
 
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Layout com Div</title>
</head>
<body>
 
    <div class="header">
        <h1>Meu Site</h1>
    </div>
 
    <div class="nav">
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </div>
 
    <div class="main">
        <div class="section">
            <div class="article">
                <h2>Título do Artigo</h2>
                <p>Conteúdo do artigo.</p>
            </div>
        </div>
 
        <div class="aside">
            <h3>Links Relacionados</h3>
            <p>Conteúdo complementar.</p>
        </div>
    </div>
 
    <div class="footer">
        <p>&copy; 2026 Meu Site</p>
    </div>
 
</body>
</html>

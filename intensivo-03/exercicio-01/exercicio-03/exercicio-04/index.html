<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!-- Meta viewport utilizada para responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meta Viewport</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main>

        <h1>Meta Viewport</h1>

        <p>
            Este projeto utiliza a meta viewport para adaptar
            a página corretamente aos dispositivos móveis.
        </p>

        <div class="box">
            <h2>Teste no celular</h2>

            <p>
                A meta viewport permite que a largura da página
                acompanhe a largura da tela do dispositivo.
            </p>
        </div>

    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Modal de Aviso</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 100px; }
  button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; background: #3b82f6; color: white; }
  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  }
  .overlay.ativo { display: flex; }
  .modal {
    background: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 320px;
    text-align: center;
  }
</style>
</head>
<body>
  <button id="abrirModal">Mostrar aviso</button>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>Atenção!</h2>
      <p>Este é um aviso importante. Clique fora desta caixa para fechar.</p>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const abrirModal = document.getElementById('abrirModal');

    abrirModal.addEventListener('click', () => {
      overlay.classList.add('ativo');
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.remove('ativo');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Botão Hover</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 100px; }
  #btn {
    padding: 14px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #3b82f6;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
</style>
</head>
<body>
  <button id="btn">Passe o mouse aqui</button>

  <script>
    const btn = document.getElementById('btn');
    const cores = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b'];

    btn.addEventListener('mouseenter', () => {
      const corAleatoria = cores[Math.floor(Math.random() * cores.length)];
      btn.style.backgroundColor = corAleatoria;
    });

    btn.addEventListener('mouseleave', () => {
      btn.style.backgroundColor = '#3b82f6';
    });
  </script>
</body>
</html>

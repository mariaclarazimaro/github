<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-8">

        <h1 class="text-3xl font-bold text-center mb-8">
            Produtos
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-2">Produto 1</h2>
                <p class="text-gray-600 mb-4">
                    Descrição do primeiro produto.
                </p>
                <button class="bg-blue-500 text-white px-4 py-2 rounded">
                    Comprar
                </button>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-2">Produto 2</h2>
                <p class="text-gray-600 mb-4">
                    Descrição do segundo produto.
                </p>
                <button class="bg-blue-500 text-white px-4 py-2 rounded">
                    Comprar
                </button>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-2">Produto 3</h2>
                <p class="text-gray-600 mb-4">
                    Descrição do terceiro produto.
                </p>
                <button class="bg-blue-500 text-white px-4 py-2 rounded">
                    Comprar
                </button>
            </div>

        </div>

    </div>

</body>
</html>
